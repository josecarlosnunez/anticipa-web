<title>Demostración privada · Anticipa</title>
<meta name="theme-color" content="#0b1219">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-512.png">

<style>
:root{--papel:#0b1219;--tinta:#eef2f6;--dim:#8e9aa8;--linea:#22303d;--campo:#111b25;--acento:#5980a6;--mal:#f08a7a;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--sans:Barlow,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px}
.marca{height:22px;color:var(--tinta);--logo-acento:#a9bed3}
.marca .logo{height:100%;width:auto;display:block}
h1{font-family:var(--cond);font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin-top:22px;text-wrap:balance}
p{color:var(--dim);font-size:15px;line-height:1.5;margin-top:10px;max-width:40ch}
form{margin-top:26px;display:flex;flex-direction:column;gap:10px}
label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
input{width:100%;background:var(--campo);color:var(--tinta);border:1px solid var(--linea);border-radius:10px;padding:14px 16px;font:inherit;font-size:17px;letter-spacing:.04em}
input:focus{outline:none;border-color:var(--acento)}
button{background:var(--tinta);color:var(--papel);border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.aviso{min-height:22px;font-size:13.5px;color:var(--mal);margin-top:2px}
footer{margin-top:34px;font-size:12px;color:var(--dim);line-height:1.6}
footer a{color:var(--dim)}
main.nda{max-width:520px}
.terminos{max-height:200px;overflow:auto;background:var(--campo);border:1px solid var(--linea);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.55;color:var(--tinta)}
.terminos p{color:var(--tinta);font-size:13px;margin:0 0 8px;max-width:none}
.terminos b{color:#fff}
.acepto{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--tinta);text-transform:none;letter-spacing:0;font-weight:500}
.acepto input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--acento)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.dos{grid-template-columns:1fr}}
.firmado{display:flex;justify-content:space-between;gap:10px;background:var(--campo);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;font-size:13.5px}
.firmado button{background:none;color:var(--acento);padding:0;font-size:13px;text-decoration:underline}
[hidden]{display:none!important}
.registro{display:none;margin-top:26px}
.registro.on{display:block}
.registro .ok{width:44px;height:44px;border-radius:50%;background:#1d4d3a;color:#8fe0c2;display:grid;place-items:center;font-size:22px;margin-bottom:12px}
.registro a.boton{display:block;text-align:center;background:var(--tinta);color:var(--papel);border-radius:10px;padding:14px;font-weight:600;text-decoration:none;margin-top:14px}
.registro button.sec{width:100%;margin-top:10px;background:transparent;color:var(--tinta);border:1px solid var(--linea)}
</style>
</head>

<main>

<script>
(function(){
  var P = JSON.parse(document.getElementById("paquete").textContent);
  var ITER = 310000;
  var f = document.getElementById("f"), c = document.getElementById("c"), b = document.getElementById("b"), aviso = document.getElementById("aviso");
  var LLAVE_SESION = "anticipa-demo:avanti";
  try { localStorage.removeItem(LLAVE_SESION); } catch (e) {}
  var NDA = null;
  var LLAVE_NDA = "anticipa-nda:avanti", firma = null, htmlListo = null;
  function fechaTxt(d){ return d.toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "short" }); }
  function plantilla(txt, datos){ return txt.replace(/\{(\w+)\}/g, function(m, k){ return datos[k] != null ? datos[k] : m; }); }
  if (NDA) {
    try { firma = JSON.parse(localStorage.getItem(LLAVE_NDA) || "null"); } catch (e) { firma = null; }
    var datosNda = document.getElementById("datosNda"), firmado = document.getElementById("firmado");
    function pintarFirma(){
      var hay = firma && firma.nombre && firma.correo;
      datosNda.hidden = !!hay; firmado.hidden = !hay;
      ["nombre", "correo", "acepto"].forEach(function(id){ document.getElementById(id).required = !hay; });
      if (hay) document.getElementById("firmadoTxt").textContent = plantilla(NDA.textos.yaFirmado, { nombre: firma.nombre, fecha: firma.fecha });
      (hay ? c : document.getElementById("nombre")).focus();
    }
    document.getElementById("otro").addEventListener("click", function(){ firma = null; try { localStorage.removeItem(LLAVE_NDA); } catch (e) {} pintarFirma(); });
    pintarFirma();
  }
  /* Manda la constancia a FormSubmit; lee la respuesta real (un 200 con "needs Activation" no cuenta como enviado). */
  async function enviarConstancia(d){
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 8000);
    try {
      var r = await fetch("https://formsubmit.co/ajax/" + NDA.destinatario, { method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ _subject: NDA.textos.asunto, _template: "table", _captcha: "false", Demo: NDA.proyecto, Nombre: d.nombre, Correo: d.correo, Empresa: d.empresa || "—", Fecha: d.fecha, Pagina: location.href, Navegador: navigator.userAgent }) });
      var j = await r.json().catch(function(){ return {}; });
      return r.ok && (j.success === "true" || j.success === true) && !/activat/i.test(j.message || "");
    } catch (e) { return false; } finally { clearTimeout(tm); }
  }
  function mostrarRegistro(d){
    f.hidden = true; document.querySelector("h1").hidden = true; document.querySelector("main > p").hidden = true;
    var reg = document.getElementById("registro"); reg.classList.add("on");
    document.getElementById("enviarConstancia").href = "mailto:" + NDA.destinatario + "?subject=" + encodeURIComponent(NDA.textos.asunto) + "&body=" + encodeURIComponent(plantilla(NDA.textos.cuerpo, d));
    document.getElementById("continuar").addEventListener("click", function(){ document.open(); document.write(htmlListo); document.close(); });
  }
  function bytes(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  async function abrir(clave){
    clave = String(clave || "").trim().toLowerCase();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
    var llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, llave, bytes(P.datos));
    var html = new TextDecoder().decode(plano);
    try { sessionStorage.setItem(LLAVE_SESION, clave); } catch (e) {}
    // Los enlaces a las otras páginas de la demo llevan la clave en el fragmento (#), que nunca
    // viaja al servidor, para que abrir la simulación en otra pestaña no vuelva a pedirla.
    html = html.replace(/href="([/]demo[/][^"#]*)"/g, function (m, ruta) { return 'href="' + ruta + "#k=" + encodeURIComponent(clave) + '"'; });
    // Con NDA: la contraseña ya abrió, así que la firma es válida; se registra y, si no se pudo enviar, se pide la constancia manual.
    if (NDA && !(firma && firma.nombre && firma.correo)) {
      var d = { nombre: document.getElementById("nombre").value.trim(), correo: document.getElementById("correo").value.trim(), empresa: document.getElementById("empresa").value.trim(), fecha: fechaTxt(new Date()) };
      firma = d; try { localStorage.setItem(LLAVE_NDA, JSON.stringify(d)); } catch (e) {}
      htmlListo = html;
      if (!(await enviarConstancia(d))) { mostrarRegistro(d); return; }
    }
    document.open(); document.write(html); document.close();
  }
  f.addEventListener("submit", async function(ev){
    ev.preventDefault();
    if (NDA && !(firma && firma.nombre && firma.correo)) {
      var nom = document.getElementById("nombre").value.trim(), cor = document.getElementById("correo").value.trim();
      if (!nom || !cor || !document.getElementById("acepto").checked) { aviso.textContent = NDA.textos.faltan; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cor)) { aviso.textContent = NDA.textos.correoMal; return; }
    }
    aviso.textContent = ""; b.disabled = true; b.textContent = NDA ? NDA.textos.firmando : "Abriendo…";
    try { await abrir(c.value); }
    catch (e) { aviso.textContent = (e && e.name === "OperationError") ? "Esa contraseña no abre esta demostración. Revísala y vuelve a intentar." : "No se pudo abrir en este navegador (" + (e && e.name || "error") + "). Prueba con Safari o Chrome actualizados."; b.disabled = false; b.textContent = NDA ? NDA.textos.boton : "Entrar"; c.select(); }
  });
  try {
    var guardada = sessionStorage.getItem(LLAVE_SESION);
    var m = /[#&]k=([^&]+)/.exec(location.hash);
    if (m) { guardada = decodeURIComponent(m[1]); history.replaceState(null, "", location.pathname + location.search); }
    // Con NDA, la clave guardada solo abre sola si esta persona ya firmó en este navegador.
    if (guardada && NDA && !(firma && firma.nombre && firma.correo)) { c.value = guardada; guardada = null; }
    if (guardada) { b.disabled = true; b.textContent = "Abriendo…"; abrir(guardada).catch(function(){ try { sessionStorage.removeItem(LLAVE_SESION); } catch (e) {} b.disabled = false; b.textContent = "Entrar"; }); }
  } catch (e) {}
  if (!window.crypto || !crypto.subtle) aviso.textContent = "Tu navegador no puede abrir esta página. Prueba con Safari, Chrome o Firefox actualizados.";
})();
</script>
