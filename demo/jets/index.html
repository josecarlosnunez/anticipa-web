<style>
:root{--papel:#0b1219;--tinta:#eef2f6;--dim:#8e9aa8;--linea:#22303d;--campo:#111b25;--acento:#5980a6;--mal:#f08a7a;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--sans:Barlow,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px}
.marca{height:22px;color:var(--tinta);--logo-acento:#a9bed3}
.marca .logo{height:100%;width:auto;display:block}
h1{font-family:var(--cond);font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin-top:22px;text-wrap:balance}
p{color:var(--dim);font-size:15px;line-height:1.5;margin-top:10px;max-width:40ch}
form{margin-top:26px;display:flex;flex-direction:column;gap:10px}
label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
input{width:100%;background:var(--campo);color:var(--tinta);border:1px solid var(--linea);border-radius:10px;padding:14px 16px;font:inherit;font-size:17px;letter-spacing:.04em}
input:focus{outline:none;border-color:var(--acento)}
button{background:var(--tinta);color:var(--papel);border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.aviso{min-height:22px;font-size:13.5px;color:var(--mal);margin-top:2px}
footer{margin-top:34px;font-size:12px;color:var(--dim);line-height:1.6}
footer a{color:var(--dim)}
</style>

<script>
(function(){
  var P = JSON.parse(document.getElementById("paquete").textContent);
  var ITER = 310000;
  var f = document.getElementById("f"), c = document.getElementById("c"), b = document.getElementById("b"), aviso = document.getElementById("aviso");
  var LLAVE_SESION = "anticipa-demo:tramo";
  try { localStorage.removeItem(LLAVE_SESION); } catch (e) {}
  function bytes(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  async function abrir(clave){
    clave = String(clave || "").trim().toLowerCase();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
    var llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, llave, bytes(P.datos));
    var html = new TextDecoder().decode(plano);
    try { sessionStorage.setItem(LLAVE_SESION, clave); } catch (e) {}
    // Los enlaces a las otras páginas de la demo llevan la clave en el fragmento (#), que nunca
    // viaja al servidor, para que abrir la simulación en otra pestaña no vuelva a pedirla.
    html = html.replace(/href="([/]demo[/][^"#]*)"/g, function (m, ruta) { return 'href="' + ruta + "#k=" + encodeURIComponent(clave) + '"'; });
    document.open(); document.write(html); document.close();
  }
  f.addEventListener("submit", async function(ev){
    ev.preventDefault();
    aviso.textContent = ""; b.disabled = true; b.textContent = "Abriendo…";
    try { await abrir(c.value); }
    catch (e) { aviso.textContent = (e && e.name === "OperationError") ? "Esa contraseña no abre esta demostración. Revísala y vuelve a intentar." : "No se pudo abrir en este navegador (" + (e && e.name || "error") + "). Prueba con Safari o Chrome actualizados."; b.disabled = false; b.textContent = "Entrar"; c.select(); }
  });
  try {
    var guardada = sessionStorage.getItem(LLAVE_SESION);
    var m = /[#&]k=([^&]+)/.exec(location.hash);
    if (m) { guardada = decodeURIComponent(m[1]); history.replaceState(null, "", location.pathname + location.search); }
    if (guardada) { b.disabled = true; b.textContent = "Abriendo…"; abrir(guardada).catch(function(){ try { sessionStorage.removeItem(LLAVE_SESION); } catch (e) {} b.disabled = false; b.textContent = "Entrar"; }); }
  } catch (e) {}
  if (!window.crypto || !crypto.subtle) aviso.textContent = "Tu navegador no puede abrir esta página. Prueba con Safari, Chrome o Firefox actualizados.";
})();
</script>
