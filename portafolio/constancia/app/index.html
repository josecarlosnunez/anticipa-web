function runCapture(){
  if(!cap || cap.busy) return;
  var text = (cap.text||'').trim();
  if(!text) return;
  var local = parseCapture(text);
  if(!local) return;
  var multi = /\by\s+(?:luego|después|despues|tambi[ée]n)\b|\by\s+avisar|;/i.test(text) || text.length > 90;
  if(aiReady && (!local.sure || multi)){
    cap.busy = true; cap.readings = null; renderCapture();
    var mySeq = ++cap.seq;
    aiParse(text).then(function(items){
      if(!cap || cap.seq !== mySeq) return;
      cap.busy = false;
      cap.readings = (items && items.length) ? items : [local];
      renderCapture();
    });
  } else {
    cap.readings = [local];
    renderCapture();
  }
}

function commitCapture(){
  if(!cap || !cap.readings || !cap.readings.length) return;
  var made = {task:0, habit:0, note:0}, lastHabit = null;
  cap.readings.forEach(function(r){
    var title = (r.title||'').trim();
    if(!title) return;
    if(r.kind==='note'){
      var d = todayISO();
      state.days[d] = state.days[d] || {};
      state.days[d].note = (state.days[d].note ? state.days[d].note + '\n' : '') + title;
      made.note++;
      return;
    }
    if(r.kind==='habit'){
      var sched = r.rep && r.rep.kind==='times' ? {kind:'times', times:r.rep.times}
                : r.rep && r.rep.kind==='days' ? {kind:'days', days:r.rep.days.slice().sort()}
                : {kind:'daily'};
      var h = { id:uid(), name:title, mono:monoOf(title), type:r.type||'check',
                goal:r.type==='count' ? Math.max(1,r.goal||1) : 1, unit:r.type==='count' ? (r.unit||'') : '',
                sched:sched, order:state.habits.length, archived:false, created:todayISO() };
      state.habits.push(h); made.habit++; lastHabit = h;
      return;
    }
    state.tasks.push({
      id: uid(), title: title, kind: r.kind==='repeat' ? 'repeat' : 'task',
      due: r.kind==='repeat' ? null : (r.due || null),
      time: r.time || null,
      rep: r.kind==='repeat' ? (r.rep || {kind:'daily'}) : null,
      done:false, doneAt:null, doneOn:{}, created: todayISO()
    });
    made.task++;
  });
  save(true);
  closeCapture();
  if(made.habit && ui.view!=='habitos' && !made.task) ui.view = 'habitos';
  render({animate:true});
  var parts = [];
  if(made.task) parts.push(made.task===1 ? '1 tarea' : made.task+' tareas');
  if(made.habit) parts.push(made.habit===1 ? '1 canal' : made.habit+' canales');
  if(made.note) parts.push('1 nota');
  if(lastHabit && made.habit===1) toast('Canal creado · '+lastHabit.name, 'Editar', function(){ openEditor(lastHabit.id) });
  else if(parts.length) toast('Guardado · '+parts.join(' · '));
}

/* ============ motor de gestos ============
   Sí/No  → mantener presionado: la tinta barre la fila y al llenarla, confirma.
   Cantidad → arrastrar horizontalmente fija el valor; tocar suma 1;
              mantener suma de a uno en cadencia.                              */
var HOLD_MS = 340, REPEAT_MS = 190, DRAG_TOL = 7;
var G = null;

function paintP(el, p){ el.style.setProperty('--p', clamp(p,0,1).toFixed(4)) }
function paintVal(el, txt){ var v = el.querySelector('.val'); if(v) v.textContent = txt }
function clearTimers(){
  if(!G) return;
  if(G.raf) cancelAnimationFrame(G.raf);
  if(G.timer) clearTimeout(G.timer);
  if(G.rep) clearInterval(G.rep);
  G.raf = G.timer = G.rep = 0;
}

function gestureDown(e){
  if($('#overlay').firstChild || cap) return;
  if(ui.view!=='hoy' && ui.view!=='tareas') return;
  if(e.target.closest && e.target.closest('[data-act]')) return;
  var el = e.target.closest ? (e.target.closest('.chan') || e.target.closest('.tsk')) : null;
  if(!el || G) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  var isTask = el.classList.contains('tsk');
  var h = null, task = null, rest, goal, val = 0, kind = 'check';
  if(isTask){
    task = taskById(el.dataset.tid); if(!task) return;
    var dd = ui.view==='tareas' ? todayISO() : ui.date;
    rest = taskDone(task,dd) ? 1 : 0; goal = 1 - rest;
  } else {
    h = habitById(el.dataset.id); if(!h) return;
    kind = el.dataset.kind;
    rest = restP(h,ui.date); goal = targetP(h,ui.date); val = getVal(h,ui.date);
  }
  if(e.pointerType==='mouse') e.preventDefault();
  try{ el.setPointerCapture(e.pointerId) }catch(err){}
  el.classList.remove('smooth','enter'); el.classList.add('armed');
  G = { el:el, h:h, task:task, pid:e.pointerId, x0:e.clientX, y0:e.clientY,
        kind:kind, t0:Date.now(), moved:false,
        rest:rest, goal:goal, val:val, done:false,
        raf:0, timer:0, rep:0 };

  // La confirmación va por temporizador, no por frames: si el navegador
  // estrangula requestAnimationFrame, el gesto igual se completa.
  if(G.kind==='check'){
    G.timer = setTimeout(function(){ if(G){ G.done = true; gestureCommit() } }, HOLD_MS);
  } else {
    G.timer = setTimeout(function(){
      if(!G || G.moved) return;
      countStep();
      G.rep = setInterval(function(){ if(G && !G.moved) countStep() }, REPEAT_MS);
    }, HOLD_MS);
  }
  G.raf = requestAnimationFrame(gesturePaint);
}

function gesturePaint(now){
  if(!G) return;
  if(G.kind==='check'){
    var p = clamp((Date.now() - G.t0)/HOLD_MS, 0, 1);
    paintP(G.el, G.rest + (G.goal - G.rest)*p);
  }
  G.raf = requestAnimationFrame(gesturePaint);
}

function countStep(){
  if(!G) return;
  G.val = clamp(G.val + 1, 0, 9999);
  paintP(G.el, G.val/target(G.h));
  paintVal(G.el, G.val+'/'+G.h.goal);
}

function gestureMove(e){
  if(!G || e.pointerId!==G.pid) return;
  var dx = e.clientX - G.x0, dy = e.clientY - G.y0;
  if(G.kind!=='count'){
    if(Math.abs(dy) > 30 || Math.abs(dx) > 60) gestureAbort();
    return;
  }
  if(!G.moved && Math.abs(dx) < DRAG_TOL) return;
  if(!G.moved){ G.moved = true; clearTimers(); G.raf = requestAnimationFrame(gesturePaint) }
  var r = G.el.getBoundingClientRect();
  G.val = Math.round(clamp((e.clientX - r.left)/r.width, 0, 1) * target(G.h));
  paintP(G.el, G.val/target(G.h));
  paintVal(G.el, G.val+'/'+G.h.goal);
}

function gestureUp(e){
  if(!G || (e && e.pointerId!==undefined && e.pointerId!==G.pid)) return;
  if(G.kind==='count'){
    if(!G.moved && !G.rep && Date.now() - G.t0 < HOLD_MS) G.val = clamp(G.val + 1, 0, 9999);
    gestureCommit();
  } else if(!G.done){
    gestureAbort();
  }
}

function gestureAbort(){
  if(!G) return;
  clearTimers();
  var el = G.el, rest = G.rest;
  el.classList.add('smooth'); el.classList.remove('armed');
  paintP(el, rest);
  G = null;
}

function gestureCommit(){
  if(!G) return;
  clearTimers();
  if(G.task){
    var tk = G.task, td = ui.view==='tareas' ? todayISO() : ui.date, was = taskDone(tk,td);
    G.el.classList.remove('armed'); G = null;
    setTaskDone(tk, td, !was);
    render();
    toast(tk.title + ' · ' + (was ? 'reabierta' : 'hecha'), 'Deshacer', function(){
      setTaskDone(tk, td, was); render();
    });
    return;
  }
  var h = G.h, d = ui.date, el = G.el, prev = getVal(h,d);
  var next = G.kind==='count' ? clamp(G.val,0,9999) : (isDone(h,d) ? 0 : target(h));
  el.classList.remove('armed');
  G = null;
  if(next===prev){ el.classList.add('smooth'); paintP(el, restP(h,d)); return }
  lastChange = {id:h.id, d:d, prev:prev};
  ui.flash = h.id;
  setVal(h, d, next);
  render();
  ui.flash = null;
  report(h, d, prev, next);
}

function report(h, d, prev, next){
  var nowDone = next>=target(h), wasDone = prev>=target(h);
  if(nowDone && !wasDone){
    var sc = dayScore(d);
    if(sc && sc.pct>=1){
      var g = globalStreak();
      toast(g>1 ? 'Jornada completa · '+g+' días seguidos' : 'Jornada completa', 'Deshacer', undoLast);
      return;
    }
    var st = streak(h);
    toast(h.name+' · hecho'+(st>1 ? ' · racha '+st+(isWeekly(h)?'S':'D') : ''), 'Deshacer', undoLast);
  } else if(!nowDone && wasDone){
    toast(h.name+' · desmarcado', 'Deshacer', undoLast);
  } else if(h.type==='count'){
    toast(h.name+' · '+next+' de '+h.goal+(h.unit? ' '+h.unit : ''), 'Deshacer', undoLast);
  }
}

/* ============ render ============ */
function render(opts){
  opts = opts || {};
  ui.animate = !!opts.animate;
  var v = ui.view, host = $('#view');
  host.innerHTML = v==='hoy' ? renderHoy() : v==='semana' ? renderSemana() : v==='anio' ? renderAnio() : v==='tareas' ? renderTareas() : renderHabitos();
  ui.animate = false;

  Array.prototype.forEach.call(document.querySelectorAll('#nav button[data-view]'), function(b){
    b.classList.toggle('on', b.dataset.view===v);
  });
  if(!persistent){ var sv=$('#savedAt'); if(sv) sv.textContent='Sin persistencia' }

  var heat = host.querySelector('.heat');
  if(heat) heat.scrollLeft = heat.scrollWidth;

  requestAnimationFrame(function(){
    Array.prototype.forEach.call(host.querySelectorAll('.od'), function(o){
      var i = o.querySelector('i');
      if(i) i.style.transform = 'translateY(-'+(+o.dataset.d)+'em)';
    });
  });

  var note = document.getElementById('dayNote');
  if(note){
    note.addEventListener('input', function(){
      var d = ui.date;
      state.days[d] = state.days[d] || {};
      state.days[d].note = note.value;
      if(!note.value && !state.days[d].mood) delete state.days[d];
      save();
    });
  }
}

/* ============ eventos ============ */
document.addEventListener('pointerdown', gestureDown, {passive:false});
document.addEventListener('pointermove', gestureMove, {passive:true});
document.addEventListener('pointerup', gestureUp, {passive:true});
document.addEventListener('pointercancel', gestureAbort, {passive:true});

document.getElementById('capBtn').addEventListener('click', openCapture);

document.addEventListener('click', function(e){
  var c = e.target.closest('[data-cap]');
  if(c){
    var act = c.dataset.cap, i = +c.dataset.idx;
    if(act==='close'){ closeCapture(); return }
    if(act==='save'){ commitCapture(); return }
    if(act==='kind' && cap && cap.readings[i]){
      var r = cap.readings[i];
      r.kind = c.dataset.v;
      if(r.kind==='habit' && !r.rep) r.rep = {kind:'daily'};
      if(r.kind==='repeat' && !r.rep) r.rep = {kind:'daily'};
      renderCapture(); return;
    }
    return;
  }
  if(e.target.closest('#capHost')) return;

  var el = e.target.closest('[data-act],[data-global],[data-view]');
  if(!el || el.closest('#overlay')) return;

  if(el.dataset.act==='capture'){ openCapture(); return }
  if(el.dataset.act==='delTask'){
    e.stopPropagation();
    var tk = taskById(el.dataset.tid); if(!tk) return;
    var idx = state.tasks.indexOf(tk);
    state.tasks.splice(idx,1); save(true); render();
    toast('Tarea eliminada', 'Deshacer', function(){
      state.tasks.splice(idx,0,tk); save(true); render();
    });
    return;
  }
  if(el.dataset.act==='aiclear'){
    native({action:'clearKey'}).then(function(){ aiReady=false; render(); toast('Clave borrada') });
    return;
  }

  if(el.dataset.view){ ui.view = el.dataset.view; render({animate:true}); window.scrollTo(0,0); return }
  if(el.dataset.global==='export'){ openExport(); return }
  if(el.dataset.global==='import'){ openImport(); return }

  var a = el.dataset.act;
  if(!a) return;

  if(a==='cellToggle'){
    var h2 = habitById(el.dataset.id), d2 = el.dataset.d; if(!h2) return;
    var prev = getVal(h2,d2);
    lastChange = {id:h2.id, d:d2, prev:prev};
    setVal(h2, d2, prev>=target(h2) ? 0 : target(h2));
    render(); return;
  }
  if(a==='setday'){ ui.date = el.dataset.d; render({animate:true}); return }
  if(a==='prevday'){ ui.date = addDays(ui.date,-1); render({animate:true}); return }
  if(a==='nextday'){ if(ui.date<todayISO()){ ui.date = addDays(ui.date,1); render({animate:true}) } return }
  if(a==='prevweek'){ ui.weekOffset--; render({animate:true}); return }
  if(a==='nextweek'){ if(ui.weekOffset<0){ ui.weekOffset++; render({animate:true}) } return }
  if(a==='heatsel'){ ui.heatSel = el.dataset.v; render(); return }
  if(a==='mood'){
    var dm = ui.date, mv = +el.dataset.v;
    state.days[dm] = state.days[dm] || {};
    if(state.days[dm].mood===mv) delete state.days[dm].mood; else state.days[dm].mood = mv;
    if(!state.days[dm].mood && !(state.days[dm].note||'').trim()) delete state.days[dm];
    save(); render(); return;
  }
  if(a==='newhabit'){ openEditor(null); return }
  if(a==='edit'){ openEditor(el.dataset.id); return }
  if(a==='moveup' || a==='movedown'){
    var list = activeHabits(), i = list.findIndex(function(x){ return x.id===el.dataset.id });
    var j = a==='moveup' ? i-1 : i+1;
    if(i<0 || j<0 || j>=list.length) return;
    var tmp = list[i].order; list[i].order = list[j].order; list[j].order = tmp;
    save(true); render(); return;
  }
  if(a==='wipe'){
    confirmBox('¿Borrar todo?', 'Se eliminan canales, marcas y notas de este dispositivo. Exportá una copia antes si tenés dudas.', 'Borrar todo', function(){
      var backup = JSON.stringify(state);
      store.del(); MEM=null; load(); applyTheme(); closeModal(); render({animate:true});
      toast('Todo borrado', 'Deshacer', function(){
        try{ store.set(backup) }catch(err){ MEM = backup } load(); applyTheme(); render({animate:true});
      });
    });
    return;
  }
});

document.addEventListener('input', function(e){
  var f = e.target.closest && e.target.closest('[data-cap]');
  if(!f || !cap || !cap.readings) return;
  var r = cap.readings[+f.dataset.idx]; if(!r) return;
  var k = f.dataset.cap, v = f.value.trim();
  if(k==='title') r.title = f.value;
  if(k==='due')  r.due  = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
  if(k==='time') r.time = /^\d{1,2}:\d{2}$/.test(v) ? (v.length===4?'0'+v:v) : null;
}, true);

document.addEventListener('change', function(e){
  var a = e.target.dataset ? e.target.dataset.act : null;
  if(a==='aikey'){
    var k = e.target.value.trim();
    if(!k) return;
    e.target.value = '';
    native({action:'setKey', key:k}).then(function(r){
      aiReady = !!(r && r.ok);
      render();
      toast(aiReady ? 'Clave guardada en el Llavero' : 'No se pudo guardar la clave');
    }, function(){ toast('No se pudo guardar la clave') });
    return;
  }
  if(a==='aimodel'){ state.settings.aiModel = e.target.value; save(true); return }
  if(a==='weekstart'){ state.settings.weekStart = +e.target.value; save(true); render() }
  if(a==='themesel'){ state.settings.theme = e.target.value; save(true); applyTheme() }
});

document.getElementById('themeBtn').addEventListener('click', function(){
  var order = ['auto','light','dark'], i = order.indexOf(state.settings.theme);
  state.settings.theme = order[(i+1)%3];
  save(true); applyTheme();
  toast('Tema · '+({auto:'automático', light:'claro', dark:'oscuro'})[state.settings.theme]);
});

document.addEventListener('keydown', function(e){
  if(cap){
    if(e.key==='Escape'){ e.preventDefault(); closeCapture(); return }
    if(e.key==='Enter'){
      e.preventDefault();
      if(cap.readings && cap.readings.length) commitCapture(); else runCapture();
      return;
    }
    return;
  }
  if(e.key==='Escape'){ if($('#overlay').firstChild) closeModal(); return }
  var tag = (e.target.tagName||'').toLowerCase();
  if(e.key==='/' && tag!=='input' && tag!=='textarea' && !e.metaKey && !e.ctrlKey && !$('#overlay').firstChild){
    e.preventDefault(); openCapture(); return;
  }
  if(tag==='input' || tag==='textarea' || tag==='select' || e.metaKey || e.ctrlKey || e.altKey) return;
  if($('#overlay').firstChild) return;

  if(/^[1-9]$/.test(e.key) && ui.view==='hoy'){
    var rows = document.querySelectorAll('#view .chan'), r = rows[+e.key-1];
    if(!r) return;
    e.preventDefault();
    var h = habitById(r.dataset.id); if(!h) return;
    var d = ui.date, prev = getVal(h,d);
    var next = h.type==='count' ? prev+1 : (isDone(h,d) ? 0 : target(h));
    lastChange = {id:h.id, d:d, prev:prev};
    ui.flash = h.id; setVal(h,d,next); render(); ui.flash = null;
    report(h, d, prev, next);
    return;
  }
  if(e.key==='ArrowLeft'){ if(ui.view==='hoy'){ ui.date=addDays(ui.date,-1); render({animate:true}) } else if(ui.view==='semana'){ ui.weekOffset--; render({animate:true}) } }
  if(e.key==='ArrowRight'){ if(ui.view==='hoy'&&ui.date<todayISO()){ ui.date=addDays(ui.date,1); render({animate:true}) } else if(ui.view==='semana'&&ui.weekOffset<0){ ui.weekOffset++; render({animate:true}) } }
  if(e.key==='t' || e.key==='T'){ ui.date=todayISO(); ui.weekOffset=0; render({animate:true}) }
  if(e.key==='u' || e.key==='U'){ undoLast() }
  if(e.key==='n' || e.key==='N'){ openEditor(null) }
});

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible'){
    var t = todayISO();
    if(ui.view==='hoy' && ui.date!==t && diffDays(ui.date,t)>0){ ui.date = t; render({animate:true}) }
  }
});

/* ============ reloj de la barra ============ */
function tickClock(){
  var el = document.getElementById('clock'); if(!el) return;
  var now = new Date();
  var end = new Date(now); end.setHours(23,59,59,999);
  var mins = Math.max(0, Math.floor((end-now)/60000));
  el.innerHTML = '<b>'+pad2(now.getHours())+':'+pad2(now.getMinutes())+'</b>'+
    '<span class="sep">·</span>quedan <b>'+Math.floor(mins/60)+'h '+pad2(mins%60)+'m</b>';
}

/* ============ arranque ============ */
load();
applyTheme();
checkAI();
render({animate:true});
tickClock();
setInterval(tickClock, 20000);
window.addEventListener('storage', function(e){ if(e.key===KEY){ load(); applyTheme(); render() } });
})();
</script>
